[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ebbinghaus-reviewer"
dynamic = ["version"]
description = "Review what you study along the Ebbinghaus forgetting curve: a spaced-repetition CLI and local web app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jumin Cho" }]
keywords = ["spaced-repetition", "forgetting-curve", "ebbinghaus", "sm-2", "study", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "platformdirs>=4.0",
    "rich>=13.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
ebbinghaus = "ebbinghaus_reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/jumincho/ebbinghaus-reviewer"
Issues = "https://github.com/jumincho/ebbinghaus-reviewer/issues"

[dependency-groups]
test = [
    "httpx>=0.27",
    "httpx2>=2.0",
    "hypothesis>=6.100",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
lint = [
    "mypy>=1.11",
    "ruff>=0.6",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.version]
path = "src/ebbinghaus_reviewer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ebbinghaus_reviewer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs/*.md", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["ebbinghaus_reviewer"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '\.\.\.']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "PTH", "RET", "PIE"]

[tool.ruff.lint.isort]
known-first-party = ["ebbinghaus_reviewer"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
