name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]" --group dev
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]" --group test
      - name: Pytest
        run: pytest --cov --cov-report=term-missing

  core-only:
    name: Test without the web extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test
      - name: Pytest (web tests are skipped)
        run: pytest

  package:
    name: Build & smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Smoke test
        run: |
          export EBBINGHAUS_DB="$RUNNER_TEMP/smoke.sqlite3"
          /tmp/wheel-env/bin/ebbinghaus --version
          /tmp/wheel-env/bin/ebbinghaus demo
          /tmp/wheel-env/bin/ebbinghaus due
          /tmp/wheel-env/bin/ebbinghaus stats
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
