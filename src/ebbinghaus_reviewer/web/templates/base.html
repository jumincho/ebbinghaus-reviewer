<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Ebbinghaus Reviewer</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="{{ url_for('static', path='icon.svg') }}" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% set here = request.url.path %}
  <header class="site-header">
    <a class="brand" href="/">
      <img src="{{ url_for('static', path='icon.svg') }}" alt="" width="28" height="28">
      Ebbinghaus Reviewer
    </a>
    <nav aria-label="Main">
      <a href="/" {% if here == "/" %}aria-current="page"{% endif %}>Today</a>
      <a href="/review" {% if here == "/review" %}aria-current="page"{% endif %}>Review</a>
      <a href="/items" {% if here.startswith("/items") %}aria-current="page"{% endif %}>Items</a>
      <a href="/agenda" {% if here == "/agenda" %}aria-current="page"{% endif %}>Agenda</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Ebbinghaus Reviewer {{ version }} · reviews scheduled along the forgetting curve
  </footer>
</body>
</html>
