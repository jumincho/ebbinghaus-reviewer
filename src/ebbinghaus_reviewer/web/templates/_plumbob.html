{#- A Sims-style plumbob: its colour and face show how an item is doing (see plumbob.py). -#}
{% macro plumbob(mood, size=20, label=none, big=false) -%}
<svg class="plumbob plumbob-{{ mood.value }}{{ ' big' if big }}" viewBox="0 0 40 64" width="{{ '%.1f' | format(size * 40 / 64) }}" height="{{ size }}" role="img" aria-label="{{ label or 'Plumbob: ' ~ mood.value }}">
  <title>{{ mood.description }}</title>
  <polygon class="f1" points="20,1 1,32 8,32"/>
  <polygon class="f2" points="20,1 8,32 32,32"/>
  <polygon class="f3" points="20,1 32,32 39,32"/>
  <polygon class="f4" points="1,32 20,63 8,32"/>
  <polygon class="f5" points="8,32 20,63 32,32"/>
  <polygon class="f6" points="32,32 20,63 39,32"/>
  <polygon class="gloss" points="19.4,4.5 9.6,29.5 12.4,29.5"/>
  <polygon class="edge" points="20,1 39,32 20,63 1,32"/>
  <g class="face" transform="translate(20 31) scale(1.35) translate(-20 -31)">
    {%- if mood.value == "fresh" %}
    <path d="M13.2 27.8q2.3-2.9 4.6 0M22.2 27.8q2.3-2.9 4.6 0"/>
    <path class="ink" d="M16 32.4h8q0 5-4 5t-4-5z"/>
    <ellipse class="blush" cx="12.6" cy="31.2" rx="1.9" ry="1.1"/>
    <ellipse class="blush" cx="27.4" cy="31.2" rx="1.9" ry="1.1"/>
    {%- elif mood.value == "due" %}
    <circle class="ink" cx="15.5" cy="27.2" r="1.7"/>
    <circle class="ink" cx="24.5" cy="27.2" r="1.7"/>
    <path d="M16.6 33.2q3.4 3 6.8 0"/>
    {%- else %}
    <path d="M12.8 25.6l4-1.7M27.2 25.6l-4-1.7"/>
    <circle class="ink" cx="15.5" cy="28.4" r="1.5"/>
    <circle class="ink" cx="24.5" cy="28.4" r="1.5"/>
    <path d="M15.6 35.6q1.1-1.8 2.2 0t2.2 0t2.2 0t2.2 0"/>
    {%- endif %}
  </g>
</svg>
{%- endmacro %}
